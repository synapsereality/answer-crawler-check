name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  action:
    # Runs the action from this checkout against a small local build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir -p site
          printf '<urlset><url><loc>https://example.com/</loc></url></urlset>' > site/sitemap.xml
          printf 'User-agent: *\nAllow: /\n' > site/robots.txt
      - uses: ./
        with:
          sitemap: site/sitemap.xml
          site-dir: site
